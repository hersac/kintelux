<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestión de Clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestión de Clientes</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Botón para registrar nuevo cliente -->
  <div class="ion-padding">
    <ion-button
      (click)="toggleFormulario()"
      expand="block"
      fill="outline"
      color="primary"
    >
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      {{ mostrarFormulario ? 'Cancelar Registro' : 'Registrar Nuevo Cliente' }}
    </ion-button>
  </div>

  <!-- Formulario de Clientes (condicional) -->
  @if(mostrarFormulario) {
  <app-registrar-cliente
    (guardadoExitoso)="ocultarFormulario()"
  ></app-registrar-cliente>
  }

  <!-- Componente de Edición de Cliente (condicional) -->
  @if(mostrarEdicion) {
  <app-descripcion-cliente
    [cliente]="clienteSeleccionado"
    (guardadoExitoso)="ocultarEdicion()"
    (cancelar)="ocultarEdicion()"
  ></app-descripcion-cliente>
  }

  <!-- Tabla de Clientes -->
  <app-tabla-clientes
    (clienteSeleccionado)="onClienteSeleccionado($event)"
  ></app-tabla-clientes>
</ion-content>
