<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestión de Items</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestión de Items</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Botón para registrar nuevo item -->
  <div class="ion-padding">
    <ion-button
      (click)="toggleFormulario()"
      expand="block"
      fill="outline"
      color="primary"
    >
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      {{ mostrarFormulario ? 'Cancelar Registro' : 'Registrar Nuevo Item' }}
    </ion-button>
  </div>

  <!-- Formulario de Items (condicional) -->
  @if(mostrarFormulario) {
  <app-registrar-item
    (guardadoExitoso)="ocultarFormulario()"
  ></app-registrar-item>
  }

  <!-- Componente de Edición de Item (condicional) -->
  @if(mostrarEdicion) {
  <app-descripcion-item
    [item]="itemSeleccionado"
    (guardadoExitoso)="ocultarEdicion()"
    (cancelar)="ocultarEdicion()"
  ></app-descripcion-item>
  }

  <!-- Tabla de Items -->
  <app-tabla-items
    (itemSeleccionado)="onItemSeleccionado($event)"
  ></app-tabla-items>
</ion-content>
