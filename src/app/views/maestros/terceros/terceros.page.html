<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestión de Terceros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestión de Terceros</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Botón para registrar nuevo tercero -->
  <div class="ion-padding">
    <ion-button
      (click)="toggleFormulario()"
      expand="block"
      fill="outline"
      color="primary"
    >
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      {{ mostrarFormulario ? 'Cancelar Registro' : 'Registrar Nuevo Tercero' }}
    </ion-button>
  </div>

  <!-- Formulario de Terceros (condicional) -->
  @if(mostrarFormulario) {
  <app-registrar-tercero
    (guardadoExitoso)="ocultarFormulario()"
  ></app-registrar-tercero>
  }

  <!-- Componente de Edición de Tercero (condicional) -->
  @if(mostrarEdicion) {
  <app-descripcion-tercero
    [tercero]="terceroSeleccionado"
    (guardadoExitoso)="ocultarEdicion()"
    (cancelar)="ocultarEdicion()"
  ></app-descripcion-tercero>
  }

  <!-- Tabla de Terceros -->
  <app-tabla-terceros
    (terceroSeleccionado)="onTerceroSeleccionado($event)"
  ></app-tabla-terceros>
</ion-content>
