<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Salida de Mercancía</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Salida de Mercancía</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Componente de Encabezado -->
  <app-encabezado-venta
    (encabezadoValid)="onEncabezadoValidChange($event)"
  ></app-encabezado-venta>

  <!-- Componente de Movimientos -->
  <app-movimientos-venta
    (abrirModal)="abrirModalProducto()"
  ></app-movimientos-venta>

  <!-- Botón para guardar la venta -->
  <div class="ion-padding-top">
    <ion-button
      expand="block"
      color="success"
      [disabled]="!encabezadoValido"
      (click)="guardarVenta()"
    >
      Guardar Salida de Mercancía
    </ion-button>
  </div>

  <!-- Componente Modal para agregar productos -->
  <app-modal-agregar-producto
    (productoAgregado)="onProductoAgregado($event)"
  ></app-modal-agregar-producto>
</ion-content>
